name: portfolio-lucafeine

services:
  app:
    build:
      context: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      GITHUB_USER: ${GITHUB_USER:-lucafeine}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      CACHE_TTL_MS: ${CACHE_TTL_MS:-600000}
    # Aucun port publié : l'app n'est joignable que depuis le réseau Docker partagé
    # avec Nginx Proxy Manager, via le nom de service "app" et le port interne 3000.
    networks:
      - npm
    volumes:
      - app_cache:/app/.cache
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  npm:
    external: true
    # Nom réel du réseau de NPM : docker inspect npm --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{"\n"}}{{end}}'
    name: ${NPM_NETWORK:-npm_default}

volumes:
  app_cache:
