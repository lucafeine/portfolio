name: portfolio-lucafeine

services:
  app:
    build:
      context: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      GITHUB_USER: ${GITHUB_USER:-lucafeine}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      CACHE_TTL_MS: ${CACHE_TTL_MS:-600000}
    ports:
      # Nginx Proxy Manager fait le HTTPS et proxifie vers ce port.
      # 127.0.0.1 suffit si NPM est installé sur l'hôte ; sinon voir le README.
      # Port hôte choisi arbitrairement pour éviter les collisions (3000 est souvent pris).
      - "127.0.0.1:3417:3000"
    volumes:
      - app_cache:/app/.cache
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app_cache:
