    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7efe3" />
    <script>
      // Pose le thème avant le premier rendu pour éviter tout flash clair/sombre.
      // Trois modes : "light", "dark", "system" (défaut).
      (function () {
        try {
          var stored = localStorage.getItem("lucafeine-theme");
          var mode =
            stored === "light" || stored === "dark" || stored === "system"
              ? stored
              : "system";
          var dark =
            mode === "dark" ||
            (mode === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);

          document.documentElement.dataset.themeMode = mode;
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (error) {
          var prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          document.documentElement.dataset.themeMode = "system";
          document.documentElement.dataset.theme = prefersDark
            ? "dark"
            : "light";
        }
      })();
    </script>
